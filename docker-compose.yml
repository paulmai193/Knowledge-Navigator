version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: knowledge-navigator-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - knowledge-navigator-network

  weaviate:
    image: semitechnologies/weaviate:1.22.4
    container_name: knowledge-navigator-weaviate
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - knowledge-navigator-network

  ollama:
    image: ollama/ollama:latest
    container_name: knowledge-navigator-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - knowledge-navigator-network

  backend-service:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    container_name: knowledge-navigator-backend
    ports:
      - "8001:8001"
    environment:
      MONGO_URL: mongodb://mongodb:27017/knowledge_navigator
      AI_SERVICE_URL: http://ai-service:8002
      WEAVIATE_URL: http://weaviate:8080
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - mongodb
      - weaviate
      - ollama
    networks:
      - knowledge-navigator-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: knowledge-navigator-ai
    ports:
      - "8002:8002"
    environment:
      MONGO_URL: mongodb://mongodb:27017/knowledge_navigator
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_INSIGHT_MODEL: ${OLLAMA_INSIGHT_MODEL:-llama3.2}
      OLLAMA_QA_MODEL: ${OLLAMA_QA_MODEL:-llama3.2}
    depends_on:
      - mongodb
      - ollama
    networks:
      - knowledge-navigator-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledge-navigator-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8001
    depends_on:
      - backend-service
    networks:
      - knowledge-navigator-network

volumes:
  mongodb_data:
  weaviate_data:
  ollama_data:

networks:
  knowledge-navigator-network:
    driver: bridge