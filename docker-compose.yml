version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: knowledge-navigator-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - knowledge-navigator-network

  ollama:
    image: ollama/ollama:latest
    container_name: knowledge-navigator-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - knowledge-navigator-network

  backend-service:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    container_name: knowledge-navigator-backend
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/knowledge_navigator
      - AI_SERVICE_URL=http://ai-service:8002
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
      - ai-service
    networks:
      - knowledge-navigator-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: knowledge-navigator-ai
    ports:
      - "8002:8002"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/knowledge_navigator
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
    depends_on:
      - mongodb
      - ollama
    networks:
      - knowledge-navigator-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledge-navigator-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8001
    depends_on:
      - backend-service
    networks:
      - knowledge-navigator-network

volumes:
  mongodb_data:
  ollama_data:
  uploads_data:

networks:
  knowledge-navigator-network:
    driver: bridge